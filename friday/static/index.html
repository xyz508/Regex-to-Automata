<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Friday</title>
<meta name="theme-color" content="#05080d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #05080d; --panel: #0c131c; --line: #1b2838; --text: #d9e6f2; --dim: #6f8399;
    --glow: #38d6ff; --glow2: #ff9f38; --err: #ff5c6c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  header { width: 100%; max-width: 640px; display: flex; justify-content: space-between;
    align-items: center; padding: 14px 0; }
  header h1 { margin: 0; font-size: 15px; letter-spacing: .35em; color: var(--glow); font-weight: 600; }
  header button { background: none; border: 1px solid var(--line); color: var(--dim);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  main { flex: 1; width: 100%; max-width: 640px; display: flex; flex-direction: column;
    align-items: center; min-height: 0; }
  #orb { width: 168px; height: 168px; border-radius: 50%; margin: 18px 0 10px; border: 0; cursor: pointer;
    background: radial-gradient(circle, #e8fbff 0 8%, var(--glow) 22%, #0a3a4d 52%, transparent 70%);
    box-shadow: 0 0 40px #38d6ff55, inset 0 0 30px #38d6ff44; transition: transform .2s; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent; }
  #orb:active { transform: scale(.96); }
  #orb.listening { animation: pulse 1.1s ease-in-out infinite; }
  #orb.thinking { animation: spin 1.4s linear infinite;
    background: conic-gradient(from 0deg, var(--glow), transparent 40%, var(--glow) 60%, transparent);
    -webkit-mask: radial-gradient(circle, transparent 46%, #000 48% 68%, transparent 70%);
            mask: radial-gradient(circle, transparent 46%, #000 48% 68%, transparent 70%); }
  #orb.speaking { animation: pulse .6s ease-in-out infinite; box-shadow: 0 0 60px #ff9f3866; }
  @keyframes pulse { 50% { transform: scale(1.07); box-shadow: 0 0 70px #38d6ffaa; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { color: var(--dim); font-size: 14px; min-height: 22px; text-align: center; }
  #live { color: var(--text); font-size: 15px; min-height: 22px; text-align: center; font-style: italic; }
  #log { width: 100%; flex: 1; overflow-y: auto; margin-top: 12px; padding-bottom: 8px; min-height: 0; }
  .msg { padding: 10px 12px; border-radius: 12px; margin: 8px 0; max-width: 88%; word-wrap: break-word; }
  .you { background: #132131; margin-left: auto; }
  .fri { background: var(--panel); border: 1px solid var(--line); }
  .fri.err { border-color: var(--err); }
  .alert { background: #2a1a08; border: 1px solid #5c3a10; color: #ffd8a8; }
  .act { display: inline-block; margin: 8px 8px 0 0; padding: 9px 14px; border-radius: 10px;
    background: var(--glow2); color: #1a0d00; font-weight: 600; text-decoration: none; }
  form { width: 100%; max-width: 640px; display: flex; gap: 8px; padding: 10px 0 14px; }
  input { flex: 1; min-width: 0; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; font-size: 16px; }
  form button, #gate button { background: var(--glow); color: #00121a; border: 0; border-radius: 10px;
    padding: 0 16px; font-weight: 700; font-size: 15px; cursor: pointer; }
  .row { display: flex; gap: 14px; align-items: center; color: var(--dim); font-size: 13px; }
  .row label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  #gate { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 16px; z-index: 9; }
  #gate input { max-width: 260px; text-align: center; letter-spacing: .2em; }
  #gate button { padding: 12px 20px; }
  #gate p { color: var(--dim); max-width: 320px; text-align: center; font-size: 14px; margin: 0; }
</style>
</head>
<body>
<div id="gate">
  <h1 style="color:var(--glow);letter-spacing:.35em;font-size:18px;margin:0">FRIDAY</h1>
  <p>Enter the passcode shown in the window where you started Friday.</p>
  <input id="code" type="password" autocomplete="current-password" placeholder="passcode">
  <button id="unlock">Unlock</button>
  <p id="gateErr" style="color:var(--err)"></p>
</div>

<header>
  <h1>FRIDAY</h1>
  <div class="row">
    <label><input type="checkbox" id="handsfree"> Hands-free</label>
    <button id="newchat" title="Start a fresh conversation">New chat</button>
  </div>
</header>

<main>
  <button id="orb" aria-label="Tap to talk"></button>
  <div id="status">Tap the orb and speak</div>
  <div id="live"></div>
  <div id="log" aria-live="polite"></div>
</main>

<form id="form">
  <input id="text" placeholder="Or type here..." autocomplete="off">
  <button>Send</button>
</form>

<script>
const $ = (id) => document.getElementById(id);
const orb = $("orb"), statusEl = $("status"), live = $("live"), log = $("log");
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let key = store.get("friday_key") || "";
let busy = false, listening = false;
const handsfree = $("handsfree");
handsfree.checked = store.get("friday_handsfree") === "1";
handsfree.onchange = () => store.set("friday_handsfree", handsfree.checked ? "1" : "0");

// ---------- passcode gate ----------
async function api(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json", "X-Friday-Key": key },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { showGate("Wrong passcode."); throw new Error("auth"); }
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}
function showGate(err) { $("gate").style.display = "flex"; $("gateErr").textContent = err || ""; $("code").focus(); }
$("unlock").onclick = async () => {
  key = $("code").value.trim();
  try { await api("/api/check"); store.set("friday_key", key); $("gate").style.display = "none"; greet(); }
  catch (e) { if (e.message !== "auth") $("gateErr").textContent = "Can't reach Friday's server."; }
};
$("code").onkeydown = (e) => { if (e.key === "Enter") $("unlock").click(); };

// ---------- chat log ----------
function add(cls, text, actions) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  for (const a of actions || []) {
    const link = document.createElement("a");
    link.className = "act"; link.href = a.url; link.textContent = a.label;
    link.target = "_blank"; link.rel = "noopener noreferrer";
    d.appendChild(document.createElement("br")); d.appendChild(link);
  }
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function setState(s, msg) { orb.className = s; statusEl.textContent = msg; }

// ---------- speech out ----------
const synth = window.speechSynthesis;
let voice = null;
function pickVoice() {
  const vs = synth ? synth.getVoices() : [];
  const en = vs.filter(v => /^en/i.test(v.lang));
  voice = en.find(v => /female|samantha|zira|aria|jenny|google uk english female|moira|tessa|veena|serena/i.test(v.name))
       || en.find(v => /en-(GB|IE|IN)/i.test(v.lang)) || en[0] || null;
}
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }

function speak(text) {
  return new Promise((resolve) => {
    if (!synth || !text) return resolve();
    synth.cancel();
    // Chrome stops long utterances after ~15s, so speak sentence by sentence.
    const parts = text.match(/[^.!?]+[.!?]*/g) || [text];
    let i = 0;
    setState("speaking", "Speaking... tap to stop");
    const next = () => {
      if (i >= parts.length) { setState("", "Tap the orb and speak"); return resolve(); }
      const u = new SpeechSynthesisUtterance(parts[i++].trim());
      if (voice) u.voice = voice;
      u.rate = 1.05; u.pitch = 1.05;
      u.onend = next; u.onerror = () => { setState("", "Tap the orb and speak"); resolve(); };
      synth.speak(u);
    };
    next();
  });
}

// ---------- speech in ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function listen() {
  if (!SR) { setState("", "Voice input isn't supported in this browser. Use Chrome, Edge or Safari, or type."); return; }
  if (busy || listening) return;
  rec = new SR();
  rec.lang = navigator.language || "en-US";
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  let finalText = "";
  rec.onstart = () => { listening = true; setState("listening", "Listening..."); live.textContent = ""; };
  rec.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t; else interim += t;
    }
    live.textContent = finalText + interim;
  };
  rec.onerror = (e) => {
    const msg = e.error === "not-allowed" ? "Microphone blocked. Allow mic access (needs https or localhost)."
              : e.error === "no-speech" ? "Didn't hear anything." : "Mic error: " + e.error;
    setState("", msg);
  };
  rec.onend = () => {
    listening = false; live.textContent = "";
    const t = finalText.trim();
    if (t) send(t); else if (orb.className === "listening") setState("", "Tap the orb and speak");
  };
  rec.start();
}

orb.onclick = () => {
  if (synth && synth.speaking) { synth.cancel(); setState("", "Tap the orb and speak"); return; }
  if (listening && rec) { rec.stop(); return; }
  listen();
};

// ---------- talk to Friday ----------
async function send(text) {
  if (busy) return;
  if (/^(stop|cancel|bye|goodbye|that'?s all)[.!]?$/i.test(text)) {
    add("you", text); handsfree.checked = false; store.set("friday_handsfree", "0");
    add("fri", "Standing by."); speak("Standing by."); return;
  }
  busy = true; add("you", text); setState("thinking", "Thinking...");
  let reply, actions = [], err = false;
  try { const r = await api("/api/ask", { text }); reply = r.reply; actions = r.actions; err = !!r.error; }
  catch (e) { reply = e.message === "auth" ? "" : "I can't reach my server. Is it still running?"; err = true; }
  busy = false;
  if (!reply) return setState("", "");
  add("fri" + (err ? " err" : ""), reply, actions);
  await speak(reply);
  if (handsfree.checked && !err) listen();
}

$("form").onsubmit = (e) => {
  e.preventDefault();
  const t = $("text").value.trim();
  if (t) { $("text").value = ""; send(t); }
};
$("newchat").onclick = async () => {
  try { await api("/api/reset", {}); log.innerHTML = ""; add("fri", "Fresh start. What do you need?"); } catch {}
};

// ---------- proactive alerts (bills, reminders) ----------
const spoken = new Set(JSON.parse(store.get("friday_spoken") || "[]"));
async function checkAlerts() {
  if (busy || listening) return;
  try {
    const { alerts } = await api("/api/alerts");
    const today = new Date().toDateString();
    const fresh = alerts.filter(a => !spoken.has(today + a));
    if (!fresh.length) return;
    fresh.forEach(a => { spoken.add(today + a); add("alert", a); });
    store.set("friday_spoken", JSON.stringify([...spoken].slice(-200)));
    if (!(synth && synth.speaking)) speak(fresh.join(" "));
  } catch {}
}

function greet() {
  const h = new Date().getHours();
  const g = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
  add("fri", g + ". Friday online. Tap the orb and tell me what you need.");
  checkAlerts();
  setInterval(checkAlerts, 60 * 1000);
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
if (!key) showGate(); else api("/api/check").then(greet).catch(() => {});
</script>
</body>
</html>
